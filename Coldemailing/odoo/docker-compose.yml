# Odoo 19 Community CRM — läuft neben dem Warmbly-Stack (eigenes Projekt, eigene Postgres).
# Start:  docker compose -f Coldemailing/odoo/docker-compose.yml up -d
# Web-UI: http://localhost:8069  (XML-RPC ebenfalls über 8069)
# DB-Passwort kommt aus ./.env (ODOO_DB_PASSWORD, gitignored).
name: odoo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD}
      # Odoo verbindet zuerst auf 'postgres' und legt seine eigene DB selbst an
      POSTGRES_DB: postgres
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: odoo:19
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons

volumes:
  odoo-db-data:
  odoo-web-data:
